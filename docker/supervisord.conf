; supervisord держит внутри одного контейнера два процесса: nginx и php-fpm.
;
; Почему supervisord, а не «php-fpm в фоне и exec nginx»: при падении
; php-fpm сайт перестаёт отвечать до перезапуска контейнера. autorestart
; возвращает его за секунды. Плюс supervisord корректно передаёт SIGTERM
; обоим процессам, поэтому при остановке Render не оставит зависших
; соединений.

[supervisord]
nodaemon = true
user = root
; Логи процессов уходят в stdout/stderr каждой секции программ, поэтому
; собственный лог supervisord пишет в пустоту.
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid

[program:php-fpm]
command = /usr/local/sbin/php-fpm --nodaemonize
autostart = true
autorestart = true
priority = 10
; Процесс слушает, но не пишет в сокет — весь вывод перенаправлен ниже.
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
; SIGTERM уходит всей группе, иначе воркеры php-fpm остаются висеть.
stopasgroup = true
killasgroup = true
stopwaitsecs = 30

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
autostart = true
autorestart = true
; Стартует после php-fpm: пока сокет 127.0.0.1:9000 не поднят, первый
; запрос к сайту получил бы 502 вместо нормального ответа.
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
stopasgroup = true
killasgroup = true
stopwaitsecs = 10