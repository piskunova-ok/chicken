; OPcache — главное отличие php-fpm от php artisan serve.
; Без него каждый запрос заново компилирует все PHP-файлы.

[opcache]
opcache.enable = 1

; CLI-процессы (artisan, composer) работают одноразово. Кеш им не нужен,
; а включение замедлило бы и сборку, и рантайм-команды.
opcache.enable_cli = 0

; 192 МБ под автозагрузчик и скомпилированные файлы Laravel + Filament.
opcache.memory_consumption = 192

; Строки кешируются отдельно от опкодов; 16 МБ хватает для набора
; классов Filament.
opcache.interned_strings_buffer = 16

; 30000 — с запасом. Laravel 13 вместе с Filament и Livewire содержит
; больше тысячи файлов, но проверяется именно суммарное число
; загруженных PHP-файлов процесса, а не файлов проекта.
opcache.max_accelerated_files = 30000

; validate_timestamps = 0 законен именно в контейнере: код неизменяем и
; приезжает новым образом, то есть перезапуском контейнера. Проверка
; времени изменения каждого файла на каждом запросе была бы чистым
; расходом CPU. Если однажды появится монтирование кода внутрь
; контейнера, значение придётся вернуть в 1.
opcache.validate_timestamps = 0

; Комментарии нужны. По ним Laravel и Filament читают атрибуты
; (#[Fillable], #[Column] и подобные) и доктрины маршрутов; без
; save_comments они молча исчезают, и приложение падает с
; «неизвестным атрибутом» уже в рантайме.
opcache.save_comments = 1