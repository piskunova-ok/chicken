; Продакшн-настройки PHP для контейнера на Render.
; Файл подключается через conf.d, поэтому может называться zz-app.ini и
; перекрывать значения из php.ini-php-production по умолчанию.

[PHP]
; 256 МБ хватает Filament и сборке blade-шаблонов. Без ограничения
; php-fpm способен съесть всю память контейнера и быть убитым Render'ом.
memory_limit = 256M

; Загрузка файлов из админки отключена (в ProductForm стоит read-only
; Placeholder), поэтому потолок небольшой. Значения оставлены на случай
; будущих форм, а не для нынешнего состояния проекта.
file_uploads = On
upload_max_filesize = 8M
post_max_size = 8M
max_file_uploads = 10

; max_execution_time обязан быть не больше fastcgi_read_timeout в
; nginx, иначе соединение оборвётся раньше, чем PHP закончит ответ.
max_execution_time = 60
max_input_time = 60

; Версия PHP в заголовках не нужна и только помогает атакующему.
expose_php = Off

; Ошибки не выводятся в ответ, а пишутся в лог. Иначе stack trace с
; путями и параметрами уехал бы к посетителю.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Даты и время в UTC. Часовой пояс сайта задаёт Laravel (config/app.php),
; а не PHP.
date.timezone = UTC

; В контейнере нет интерактивных сессий, но переменные окружения
; доступны: APP_KEY приходит из Render.
variables_order = "GPCS"